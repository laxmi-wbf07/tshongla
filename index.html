<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tshong La - Local Digital Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --bhutan-saffron: #f4811f;
            --bhutan-gold: #ffb81c;
            --whatsapp-green: #25D366;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #0f172a;
            height: 100dvh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-card {
            background: #ffffff;
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .main-card {
                height: 90vh;
                max-width: 450px;
                border-radius: 32px;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            }
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            background: linear-gradient(to bottom, #fcfcfd, #ffffff);
            scroll-behavior: smooth;
        }

        .message-content {
            font-size: 0.9375rem;
            line-height: 1.6;
            letter-spacing: -0.01em;
        }
        .message-content strong {
            font-weight: 800;
            color: #ea580c;
        }
        .message-content p { margin-bottom: 0.5rem; }
        .message-content p:last-child { margin-bottom: 0; }

        .bot-bubble {
            background: #f8fafc;
            color: #334155;
            padding: 1.1rem;
            border-radius: 24px 24px 24px 6px;
            max-width: 88%;
            border: 1px solid #f1f5f9;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .user-bubble {
            background: linear-gradient(135deg, var(--bhutan-saffron), var(--bhutan-gold));
            color: white;
            padding: 1rem 1.2rem;
            border-radius: 24px 24px 6px 24px;
            max-width: 85%;
            align-self: flex-end;
            box-shadow: 0 10px 15px -3px rgba(244, 129, 31, 0.25);
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .wa-button {
            background-color: var(--whatsapp-green);
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .wa-button:hover { transform: translateY(-2px); filter: brightness(1.05); }

        .chat-container::-webkit-scrollbar { display: none; }
        .chat-container { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <div class="main-card">
        <header class="p-6 border-b flex items-center justify-between bg-white/80 backdrop-blur-md sticky top-0 z-10">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-orange-500 to-amber-400 flex items-center justify-center text-white shadow-xl shadow-orange-100">
                    <i class="fas fa-shop text-xl"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-slate-900 tracking-tight text-lg">Tshong La</h1>
                    <p class="text-[11px] text-green-600 font-bold uppercase tracking-widest flex items-center gap-1.5">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Active
                    </p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-tighter">Support</p>
                <p class="text-sm font-black text-slate-800 tracking-tighter">+975 17817661</p>
            </div>
        </header>

        <main id="chat-box" class="chat-container">
            <div class="bot-bubble">
                <div class="message-content">
                    <p class="text-orange-600 font-extrabold text-lg mb-2">Kuzu Zangpo! 🇧🇹</p>
                    <p>Register your business today for only <strong>Nu. 499/month</strong>. No commission, no forced checkout. Just direct sales!</p>
                </div>
                <div class="mt-5 flex flex-col gap-2.5">
                    <button onclick="openWhatsApp()" class="wa-button w-full py-3.5 rounded-2xl font-extrabold text-sm flex items-center justify-center gap-2 shadow-lg shadow-green-100">
                        <i class="fab fa-whatsapp text-xl"></i> Register via WhatsApp
                    </button>
                    <a href="tel:+97517817661" class="bg-slate-100 text-slate-800 w-full py-3.5 rounded-2xl font-extrabold text-sm flex items-center justify-center gap-2 transition-colors hover:bg-slate-200">
                        <i class="fas fa-phone-alt"></i> Call +975 17817661
                    </a>
                </div>
            </div>
        </main>

        <div id="typing" class="hidden px-8 py-3">
            <div class="flex gap-1.5 items-center">
                <div class="w-2 h-2 bg-orange-400 rounded-full animate-bounce"></div>
                <div class="w-2 h-2 bg-orange-300 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                <div class="w-2 h-2 bg-orange-200 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
            </div>
        </div>

        <footer class="p-6 bg-white border-t border-slate-50">
            <div class="flex gap-2.5 bg-slate-50 p-2 rounded-3xl border border-slate-100 focus-within:border-orange-200 focus-within:ring-4 focus-within:ring-orange-50 transition-all">
                <input type="text" id="user-input" 
                    class="flex-1 bg-transparent px-4 py-2 text-[15px] font-medium focus:outline-none placeholder:text-slate-400 text-slate-800" 
                    placeholder="Ask about registration...">
                <button onclick="handleSendMessage()" id="send-btn" 
                    class="bg-slate-900 text-white w-12 h-12 rounded-2xl flex items-center justify-center hover:bg-orange-600 transition-all active:scale-90 shadow-lg">
                    <i class="fas fa-arrow-up text-sm"></i>
                </button>
            </div>
        </footer>
    </div>

    <script>
        const API_KEY = "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";
        const MODEL = "google/gemma-3-4b-it:free";
        const CONTACT_NUMBER = "+975 17817661";

        // Moved instructions to "user" role to avoid "Developer instruction is not enabled" error
        const initialSystemPrompt = `Kuzu Zangpo! You are the Tshong La Digital Assistant. 
        Business Info:
        - Registration is FREE. 
        - Monthly fee is Nu. 499. 
        - No sales commission. 
        - Customers contact sellers directly via WhatsApp or Phone.
        Rules:
        - Always use bold text for key details like **Nu. 499** or **17817661**. 
        - Respond as a helpful assistant.
        - Encourage them to use the WhatsApp button or call 17817661 to finalize.`;

        let history = [
            { role: "user", content: initialSystemPrompt },
            { role: "assistant", content: "Kuzu Zangpo! I am ready to assist as the Tshong La Digital Assistant. How can I help you get your business online today?" }
        ];

        function openWhatsApp() {
            const msg = encodeURIComponent("Hello Tshong La! I want to register my business.");
            window.open(`https://wa.me/97517817661?text=${msg}`, '_blank');
        }

        async function fetchAI(messages, retries = 5, delay = 1000) {
            try {
                const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": window.location.origin,
                        "X-Title": "Tshong La Bot"
                    },
                    body: JSON.stringify({ 
                        model: MODEL, 
                        messages: messages, 
                        temperature: 0.7,
                        max_tokens: 500
                    })
                });

                if (!res.ok) {
                    const errorData = await res.json();
                    console.error('API Error:', errorData);
                    throw new Error(errorData.error?.message || "Failed to connect");
                }
                return await res.json();
            } catch (e) {
                if (retries > 0) {
                    await new Promise(r => setTimeout(r, delay));
                    return fetchAI(messages, retries - 1, delay * 2);
                }
                throw e;
            }
        }

        function addMessageToUI(role, text) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = role === 'user' ? 'user-bubble' : 'bot-bubble';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = marked.parse(text); 
            
            div.appendChild(contentDiv);
            box.appendChild(div);
            box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
        }

        async function handleSendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            const btn = document.getElementById('send-btn');
            const typing = document.getElementById('typing');

            if (!text || btn.disabled) return;

            addMessageToUI('user', text);
            input.value = '';
            btn.disabled = true;
            typing.classList.remove('hidden');

            try {
                history.push({ role: "user", content: text });
                const data = await fetchAI(history);
                const reply = data.choices?.[0]?.message?.content || "Sorry, I couldn't generate a response.";
                
                typing.classList.add('hidden');
                addMessageToUI('assistant', reply);
                history.push({ role: "assistant", content: reply });
                
                // Keep history trimmed to save tokens
                if (history.length > 12) history.splice(2, 2);
            } catch (e) {
                console.error(e);
                typing.classList.add('hidden');
                addMessageToUI('assistant', "Kuzu Zangpo! I'm having trouble connecting to the server. Please WhatsApp us at **17817661** for immediate help!");
            } finally {
                btn.disabled = false;
            }
        }

        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSendMessage();
        });
    </script>
</body>
</html>
